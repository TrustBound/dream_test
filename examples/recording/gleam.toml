name = "recording"
version = "0.1.0"
description = "The tested code of the guides about recorded HTTP calls and recorded queries"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_json = ">= 3.0.2 and < 4.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
gleam_yielder = ">= 1.1.0 and < 2.0.0"
# Switched to a Hex version range once it is published.
dream_http_client = { git = "https://github.com/TrustBound/dream_http_client.git", ref = "d1382f9660b980ee9c17d3ed097affb911ce42ff" }
# Switched to a Hex version range once it is published.
dream_postgres = { git = "https://github.com/TrustBound/dream_postgres.git", ref = "ee7d9c8cc16be3154895a39e942f5cafc62caa09" }
dream_postgres_client = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
dream_test = { path = "../.." }
# Switched to a Hex version range once it is published.
dream_mock_server = { git = "https://github.com/TrustBound/dream_mock_server.git", ref = "42f51b21bb89af7cd732dfa6f723dbca67c53672" }
