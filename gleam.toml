name = "dream_test"
version = "3.0.0"
description = "A testing framework for Gleam that gets out of your way"
licences = ["MIT"]
repository = { type = "github", user = "TrustBound", repo = "dream_test" }
links = [{ title = "Documentation", href = "https://hexdocs.pm/dream_test" }]

[dependencies]
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.2 and < 4.0.0"
gleam_otp = ">= 1.1.0 and < 2.0.0"
gleam_regexp = ">= 1.0.0 and < 2.0.0"
gleam_stdlib = ">= 0.60.0 and < 2.0.0"

[dev-dependencies]

[documentation]
pages = [
  { title = "Guide overview", path = "guides/index.html", source = "./docs/guides/index.md" },
  { title = "Installation", path = "guides/installation.html", source = "./docs/guides/installation.md" },
  { title = "Quick Start", path = "guides/quick-start.html", source = "./docs/guides/quick-start.md" },
  { title = "Writing Tests", path = "guides/writing-tests.html", source = "./docs/guides/writing-tests.md" },
  { title = "Context-Aware Tests", path = "guides/context-aware-tests.html", source = "./docs/guides/context-aware-tests.md" },
  { title = "Assertions & Matchers", path = "guides/assertions-and-matchers.html", source = "./docs/guides/assertions-and-matchers.md" },
  { title = "Lifecycle Hooks", path = "guides/lifecycle-hooks.html", source = "./docs/guides/lifecycle-hooks.md" },
  { title = "Runner & Execution", path = "guides/runner-and-execution.html", source = "./docs/guides/runner-and-execution.md" },
  { title = "Reporters", path = "guides/reporters.html", source = "./docs/guides/reporters.md" },
  { title = "Snapshot Testing", path = "guides/snapshot-testing.html", source = "./docs/guides/snapshot-testing.md" },
  { title = "Gherkin BDD", path = "guides/gherkin-bdd.html", source = "./docs/guides/gherkin-bdd.md" },
  { title = "Utilities", path = "guides/utilities.html", source = "./docs/guides/utilities.md" },
  { title = "Coverage", path = "guides/coverage.html", source = "./docs/guides/coverage.md" },
  { title = "Coverage Badge on GitHub", path = "guides/coverage-badge.html", source = "./docs/guides/coverage-badge.md" },
  { title = "Upgrading to 3.0.0", path = "guides/upgrading-to-3.html", source = "./docs/guides/upgrading-to-3.md" },
]

[tools.dream_snippets]
markdown = [
  "README.md",
  "SECURITY.md",
  "STANDARDS.md",
  "CONTRIBUTING.md",
  "docs",
  "examples",
]
checked_from_version = "3.0.0"
guides = ["docs/guides"]
tested_files = [
  "test",
  ".github",
  "scripts",
  "examples/snippets/test",
  "examples/snippets/compile_errors",
  "examples/shopping_cart/features",
  "examples/shopping_cart/test/outputs",
]
