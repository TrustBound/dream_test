name: Publish Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish docs for (leave empty to use gleam.toml version)"
        required: false
        type: string

env:
  # A read-only Hex key. With it, dependency lookups do not hit the limit for requests with no key.
  HEXPM_READ_API_KEY: ${{ secrets.HEX_READ_API_KEY }}

jobs:
  publish-docs:
    name: Publish Documentation to Hex
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep '^version = ' gleam.toml | sed 's/version = "\(.*\)"/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing docs for version: $VERSION"

      - name: Verify package exists on Hex
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking if dream_test@${VERSION} exists on Hex..."

          HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            --retry 3 \
            --retry-delay 2 \
            "https://hex.pm/api/packages/dream_test/releases/${VERSION}")

          if [ "$HTTP_RESPONSE" = "200" ]; then
            echo "✓ Package dream_test@${VERSION} exists on Hex"
          else
            echo "✗ Error: Package dream_test@${VERSION} not found on Hex (HTTP ${HTTP_RESPONSE})"
            echo "Please publish the package first before publishing docs"
            exit 1
          fi

      - name: Install Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
          rebar3-version: "3"

      - name: Download dependencies
        run: gleam deps download

      - name: Build documentation
        run: gleam docs build

      - name: Publish documentation to Hex
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "$HEXPM_API_KEY" ]; then
            echo "Error: HEX_API_KEY secret is not set"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          echo "Publishing documentation for dream_test@${VERSION}..."
          gleam docs publish
          echo "✓ Successfully published documentation!"

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## 📚 Documentation Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** dream_test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**View docs:** https://hexdocs.pm/dream_test/${VERSION}" >> $GITHUB_STEP_SUMMARY

